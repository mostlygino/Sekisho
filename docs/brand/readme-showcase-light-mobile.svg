<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720" role="img" aria-label="See every request: Which app sent it, headers, body and timing.; Open HTTPS: Its own CA, decrypting only the hosts you list.; Change it in flight: Breakpoints, Map Local and Remote, scripts.">
