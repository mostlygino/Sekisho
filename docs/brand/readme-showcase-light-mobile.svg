 <text x="58" y="381" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#6b5a45">Its own CA, decrypting only the hosts</text><text x="58" y="415" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="400" fill="#6b5a45">you list.</text><rect x="36" y="488" width="568" height="208" rx="14" fill="#fbf8f1" stroke="#e0d5c3"/>
