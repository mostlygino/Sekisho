<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="256" viewBox="0 0 1280 256" role="img" aria-label="See every request: Which app sent it, headers, body and timing.; Open HTTPS: Its own CA, decrypting only the hosts you list.; Change it in flight: Breakpoints, Map Local and Remote, scripts.">
